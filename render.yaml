services:
  - type: web
    name: alphaedge-live
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: rm -f startup_ping.flag monitor_state.json; streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TG_TOKEN
        sync: false
      - key: TG_CHAT_ID
        sync: false
