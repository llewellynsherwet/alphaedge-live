# ════════════════════════════════════════════════════════════════════════════
# AlphaEdge — Confluence Day Template (2026-10-08 tune: "more signals")
# Reloaded every monitor loop (~5 min). Edit and the next scan picks it up.
#
# 51-day replay (2026-08-18 → 2026-10-08, 13 symbols, same gates as live):
#   previous config (all 6 SMC items required, 2.0R, cap 4)  → 0.49/day, 24% WR, −7.0R
#   THIS config (SMC: PD required, HTF + kill-zone score-only;
#                1.5R; cap 6 / 2 per symbol)                → 1.59/day (2.16 per weekday),
#                                                              42% WR, +0.05R avg, +4.0R net, max DD 10.5R
# Edge is thin (≈ breakeven) — see docs/STRATEGY_TUNE_2026-10-08.md.
# ema_vwap_kz / orb_open stay disabled (negative in the same replay).
# ════════════════════════════════════════════════════════════════════════════

session:
  # 24/7 global scanner: always_on keeps scanning Mon–Sun. Named windows are
  # labels only (Telegram / UI). Quality gates (min_score, caps, cooldowns,
  # kill_zone checklist) still apply — KZ is a confluence factor, not the
  # on/off switch for the monitor.
  always_on: true
  weekdays_only: false
  daily_summary_utc: "21:00"   # when always_on, fire once/day near this UTC hour
  windows:
    - {name: "🌏 ASIA / TOKYO",           start: "00:00", end: "07:00"}
    - {name: "🇬🇧 LONDON OPEN",           start: "07:00", end: "10:00"}
    - {name: "🇬🇧🇺🇸 LONDON CONTINUATION", start: "10:00", end: "12:00"}
    - {name: "🇺🇸 NY / LONDON OVERLAP",    start: "12:00", end: "16:00"}
    - {name: "🇺🇸 NEW YORK CLOSE",         start: "16:00", end: "21:00"}
    - {name: "🌙 LATE / SYDNEY PREP",     start: "21:00", end: "24:00"}
  kill_zones:
    - {name: "Tokyo KZ",  start: "00:00", end: "03:00"}
    - {name: "London KZ", start: "07:00", end: "10:00"}
    - {name: "NY KZ",     start: "12:30", end: "16:00"}

symbols:
  # yf = signal feed (futures have volume). quote = what users trade (cash / CFD /
  # spot). Entry/SL/TP in alerts are converted into the quote price by removing
  # the live futures basis, so US30 alerts match a broker US30, not YM futures.
  - {name: "US 30",      yf: "YM=F",     priority: 1, setups: [smc_sweep, ema_vwap_kz, vwap_pullback],
     quote: {source: yf, ticker: "^DJI", label: "US30 cash (^DJI)"}}
  - {name: "NASDAQ 100", yf: "NQ=F",     priority: 2, setups: [smc_sweep, ema_vwap_kz, vwap_pullback],
     quote: {source: yf, ticker: "^NDX", label: "NAS100 cash (^NDX)"}}
  - {name: "S&P 500",    yf: "ES=F",     priority: 3, setups: [smc_sweep, ema_vwap_kz, vwap_pullback],
     quote: {source: yf, ticker: "^GSPC", label: "SPX500 cash (^GSPC)"}}
  - {name: "GOLD",       yf: "GC=F",     priority: 4, setups: [smc_sweep, ema_vwap_kz, vwap_pullback],
     quote: {source: gold_api, ticker: "XAU", label: "XAUUSD spot"}}
  - {name: "EUR/USD",    yf: "EURUSD=X", priority: 5, setups: [smc_sweep, pip_builder]}
  - {name: "GBP/USD",    yf: "GBPUSD=X", priority: 6, setups: [smc_sweep, pip_builder]}
  - {name: "USD/JPY",    yf: "USDJPY=X", priority: 7, setups: [smc_sweep, pip_builder]}
  - {name: "AUD/USD",    yf: "AUDUSD=X", priority: 8, setups: [smc_sweep]}
  - {name: "GBP/JPY",    yf: "GBPJPY=X", priority: 9, setups: [smc_sweep, pip_builder]}
  - {name: "EUR/JPY",    yf: "EURJPY=X", priority: 10, setups: [smc_sweep, pip_builder]}
  - {name: "CAD/JPY",    yf: "CADJPY=X", priority: 11, setups: [smc_sweep]}
  - {name: "USD/CAD",    yf: "CAD=X",    priority: 12, setups: [smc_sweep, pip_builder]}
  # NZD/USD is only watched by the experimental pip_builder setup (disabled → never fetched).
  - {name: "NZD/USD",    yf: "NZDUSD=X", priority: 14, setups: [pip_builder]}
  - {name: "USD/CHF",    yf: "CHF=X",    priority: 13, setups: [smc_sweep]}

risk:
  min_rr: 1.5
  tp_rr: 1.5                  # 1.5R — beat 2.0R on every variant in the 51d replay (2026-10-08)
  daily_max_signals: 6        # ceiling, not a target (replay: ~2/weekday, max 5 in a day)
  per_symbol_max: 2
  per_setup_max: {pip_builder: 3}   # pip_builder can't use more than 3 of the 6 daily alerts
  cooldown_minutes: 40
  symbol_cooldown_minutes: 120
  max_signal_age_minutes: 20

execution:
  enabled: true
  entry_mode: market
  tp_on_reprice: keep_rr
  max_data_age_minutes: 15
  max_price_age_minutes: 10
  max_drift_atr: 0.3
  max_drift_tp_frac: 0.25
  reject_if_tp_sl_hit: true
  max_basis_age_hours: 96

correlation_groups:
  - name: us_indices
    members: {"US 30": 1, "NASDAQ 100": 1, "S&P 500": 1}
  - name: eur_gbp
    members: {"EUR/USD": 1, "GBP/USD": 1}
  # JPY crosses share JPY risk: BUY any = short JPY.
  - name: jpy_crosses
    members: {"USD/JPY": 1, "GBP/JPY": 1, "EUR/JPY": 1, "CAD/JPY": 1}
  # Dollar basket: +1 = short USD on BUY (xxx/USD); -1 = long USD on BUY (USD/xxx).
  - name: usd_pairs
    members: {"EUR/USD": 1, "GBP/USD": 1, "AUD/USD": 1, "USD/CAD": -1, "USD/CHF": -1, "USD/JPY": -1}

confluence:
  min_score: 4

setups:
  smc_sweep:
    enabled: true
    label: "Liquidity Sweep + BOS"
    entry_tf: "15m"
    min_score: 4              # core 3 + premium/discount; HTF + kill zone add score only
    swing_strength: 2
    sweep_lookback_bars: 28
    displacement_atr: 0.6
    min_fvg_atr: 0.08
    max_risk_atr: 3.5
    min_risk_atr: 0.3
    sl_buffer_atr: 0.15
    checklist:
      htf_bias:         {weight: 1, required: false}  # score-only (2026-10-08): requiring it cut alerts with no WR gain
      premium_discount: {weight: 1, required: true}   # the one context filter that helped sweeps in replay
      liquidity_sweep:  {weight: 1, required: true}
      mss_bos:          {weight: 1, required: true}
      pd_array:         {weight: 1, required: true}
      kill_zone:        {weight: 1, required: false}  # score-only: bot is 24/7 now

  orb_open:
    enabled: false
    label: "NY Opening Range Breakout"
    entry_tf: "5m"
    min_score: 5
    open_time_ny: "09:30"
    range_minutes: 15
    entry_until_ny: "10:30"
    sl_mode: "opposite"
    min_body_ratio: 0.55
    volume_mult: 1.3
    max_range_atr: 3.5
    checklist:
      htf_bias:       {weight: 1, required: true}
      breakout_close: {weight: 1, required: true}
      strong_candle:  {weight: 1, required: true}
      volume_confirm: {weight: 1, required: false}
      vwap_side:      {weight: 1, required: true}
      gap_align:      {weight: 1, required: false}

  vwap_pullback:
    enabled: true
    label: "Session VWAP Pullback (morning)"
    entry_tf: "5m"
    min_score: 5
    anchor_ny: "09:30"
    trend_bars: 16
    trend_min_frac: 0.75
    min_separation_atr: 1.0
    touch_atr: 0.2
    # Skip lunch dead-zone entirely; research: morning window carries the edge.
    avoid_ny: ["11:30", "16:00"]
    sl_buffer_atr: 0.25
    max_risk_atr: 2.2
    checklist:
      htf_bias:         {weight: 1, required: true}
      vwap_trend:       {weight: 1, required: true}
      pullback_touch:   {weight: 1, required: true}
      confirm_close:    {weight: 1, required: true}
      volume_signature: {weight: 1, required: false}
      active_hours:     {weight: 1, required: true}

  ema_vwap_kz:
    enabled: false            # researched & coded; 0% WR on loose 30d isolate — re-enable after live review
    label: "Morning EMA+VWAP Confluence"
    entry_tf: "5m"
    min_score: 5
    anchor_ny: "09:30"
    window_ny: ["09:45", "11:30"]
    trend_bars: 16
    trend_min_frac: 0.70
    min_separation_atr: 0.8
    touch_atr: 0.25
    slope_bars: 6
    min_slope_atr: 0.05
    sl_buffer_atr: 0.2
    max_risk_atr: 2.0
    checklist:
      htf_bias:         {weight: 1, required: true}
      vwap_trend:       {weight: 1, required: true}
      ema_bone:         {weight: 1, required: true}
      vwap_slope:       {weight: 1, required: true}
      confirm_close:    {weight: 1, required: true}
      volume_signature: {weight: 1, required: false}
      morning_kz:       {weight: 1, required: true}

  pip_builder:
    # ── "1000 Pip Builder" — EXPERIMENTAL, DISABLED. Research backtest + caveats:
    #    docs/STRATEGY_1000PIP_BUILDER.md. Parameters marked (assumed) are guesses.
    enabled: true                # LIVE (2026-10-09, owner-approved) as a 2nd strategy beside smc_sweep.
                                 # Backtest was NEGATIVE — see docs/STRATEGY_1000PIP_BUILDER.md. Set false to stop.
    label: "🅱 Pip Builder 6-pip scalp"
    trigger_tfs: ["5m", "15m"]   # double top/bottom or engulfing trigger charts
    zone_width_atr: 0.3          # (assumed) S/R zone width × 1H ATR(14)
    min_touches: 2               # swing points needed to form a zone
    sl_buffer_pips: 1.5          # (assumed) 1–2 pips beyond the pattern extreme
    sl_max_atr: 0.5              # reject if SL wider than 0.5 × 1H ATR
    min_tp_pips: 10
    tp_pips: 6                   # FIXED 6-pip target (owner request); null = structural swing TP
    min_rr: 0.75                 # R:R floor (6-pip TP vs SL ≤ 8 pips); see docs for break-even win rate
    tp_max_atr: 2.5              # (assumed) ATR sanity: TP ≤ this × 1H ATR
    tp1_pips: null               # optional partial target, e.g. 10
    active_hours_utc: null       # e.g. ["07:00", "20:00"]
    checklist:
      trend_agree:     {weight: 1, required: true}
      at_zone_or_band: {weight: 1, required: true}
      trigger_pattern: {weight: 1, required: true}
      sl_within_atr:   {weight: 1, required: true}
      tp_min_rr:       {weight: 1, required: true}
      news_clear:      {weight: 1, required: true}

# High-impact-news blackout for pip_builder. No free historical calendar exists, so a STATIC
# RULE is used (US NFP = first Friday 08:30 New York) + optional extra events + optional live feed.
news:
  enabled: true
  window_minutes: 30
  use_feed: false              # live only: also block this week's "High" events from a public JSON feed
  events_utc: []               # e.g. ["2026-10-28T18:00:00Z"] (FOMC)

# Position-size suggestion shown in alerts / signal log (FX only). Illustrative, not advice.
risk_per_trade:
  enabled: false               # off until you set your own account numbers
  account_size: 1000
  currency: "USD"
  risk_pct: 1.0
  lot_step: 0.01
  usdjpy_ref: 150.0            # used for the pip value of JPY crosses

# Persistent CSV of every alert + its TP/SL outcome (viewable in the app).
signal_log:
  enabled: true
  path: "signal_log.csv"

outcomes:
  enabled: true
  max_open_hours: 48
  retain_days: 14

telegram:
  trade_alerts: true
  session_open: true
  daily_summary: true
  scan_updates: false
  data_errors: true
