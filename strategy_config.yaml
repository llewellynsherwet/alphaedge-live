# ════════════════════════════════════════════════════════════════════════════
# AlphaEdge — 🐺 Moon Wolf signals (15m scan) (2026-10-29, owner request)
# Replaces the Confluence Day Template (smc_sweep / vwap_pullback / ...) and the
# Pip Builder. Logic is a port of Moon Wolf's a.py: Daily+4H swing trend, 1H/4H
# supply & demand zones, 15m double top/bottom or engulfing confirmation,
# SL = extreme ± 0.3×ATR, TP1 = max(1R, 10 pips), TP2 = opposite zone, R:R ≥ 1.5.
# Scans run on the `schedule` below (every 15 min at :02/:17/:32/:47, Mon–Fri 06:02–18:47 SAST);
# TP/SL outcome tracking keeps running every ~5 min.
# Reloaded every monitor loop. Moon Wolf notes recent results are MIXED.
# ════════════════════════════════════════════════════════════════════════════

session:
  # 24/7 global scanner: always_on keeps scanning Mon–Sun. Named windows are
  # labels only (Telegram / UI). Quality gates (min_score, caps, cooldowns,
  # kill_zone checklist) still apply — KZ is a confluence factor, not the
  # on/off switch for the monitor.
  always_on: true
  weekdays_only: false
  daily_summary_utc: "21:00"   # when always_on, fire once/day near this UTC hour
  windows:
    - {name: "🌏 ASIA / TOKYO",           start: "00:00", end: "07:00"}
    - {name: "🇬🇧 LONDON OPEN",           start: "07:00", end: "10:00"}
    - {name: "🇬🇧🇺🇸 LONDON CONTINUATION", start: "10:00", end: "12:00"}
    - {name: "🇺🇸 NY / LONDON OVERLAP",    start: "12:00", end: "16:00"}
    - {name: "🇺🇸 NEW YORK CLOSE",         start: "16:00", end: "21:00"}
    - {name: "🌙 LATE / SYDNEY PREP",     start: "21:00", end: "24:00"}
  kill_zones:
    - {name: "Tokyo KZ",  start: "00:00", end: "03:00"}
    - {name: "London KZ", start: "07:00", end: "10:00"}
    - {name: "NY KZ",     start: "12:30", end: "16:00"}

symbols:
  # yf = signal feed. quote = what the user trades. pip = "pip" size used for the
  # 10-pip TP1 minimum and the pip counts in alerts (gold $0.10, US30 1 point).
  # lot = lot size shown in the alert (owner: FX 0.02, gold 0.01, US30 0.10).
  - {name: "EUR/USD", yf: "EURUSD=X", priority: 1, setups: [moon_wolf], pip: 0.0001, lot: 0.02}
  - {name: "GBP/USD", yf: "GBPUSD=X", priority: 2, setups: [moon_wolf], pip: 0.0001, lot: 0.02}
  - {name: "USD/JPY", yf: "JPY=X",    priority: 3, setups: [moon_wolf], pip: 0.01,   lot: 0.02}
  - {name: "GBP/JPY", yf: "GBPJPY=X", priority: 4, setups: [moon_wolf], pip: 0.01,   lot: 0.02}
  - {name: "EUR/JPY", yf: "EURJPY=X", priority: 5, setups: [moon_wolf], pip: 0.01,   lot: 0.02}
  - {name: "USD/CAD", yf: "CAD=X",    priority: 6, setups: [moon_wolf], pip: 0.0001, lot: 0.02}
  - {name: "GOLD",    yf: "GC=F",     priority: 7, setups: [moon_wolf], pip: 0.1,    lot: 0.01,
     quote: {source: gold_api, ticker: "XAU", label: "XAUUSD spot"}}
  - {name: "US 30",   yf: "YM=F",     priority: 8, setups: [moon_wolf], pip: 1.0,    lot: 0.10, pip_label: "pts",
     quote: {source: yf, ticker: "^DJI", label: "US30 cash (^DJI)"}}

# Moon Wolf scan schedule (Africa/Johannesburg). The 24/7 worker checks every loop and
# runs ONE scan per slot, 2 min after each 15m close (:02/:17/:32/:47), up to 10 min late.
schedule:
  enabled: true
  timezone: "Africa/Johannesburg"
  weekdays_only: true
  minutes: [2, 17, 32, 47]   # 2 min after each 15m candle close (:00/:15/:30/:45)
  first: "06:02"             # first slot (SAST)
  last: "18:47"              # last slot (SAST)
  grace_minutes: 10          # a missed slot can still run up to 10 min late (fits a 15-min slot)

risk:
  min_rr: 1.5
  tp_rr: 1.5
  zone_hold_hours: 24         # same symbol+side+zone blocked until its trade closes (SL/TP2) or this many hours
  daily_max_signals: 8        # ceiling
  per_symbol_max: 2
  max_open_trades: 2          # Moon Wolf: at most two signals open at once
  cooldown_minutes: 0         # zone dedupe + symbol gap pace alerts; 0 = several per scan allowed
  symbol_cooldown_minutes: 120
  max_signal_age_minutes: 140 # a.py accepts a confirmation within the last 8 × 15m bars

execution:
  enabled: true
  entry_mode: market          # Moon Wolf candidates override to "limit" (entry = neckline / engulf close)
  tp_on_reprice: keep_rr
  max_data_age_minutes: 20
  max_price_age_minutes: 10
  max_drift_atr: 0.6
  max_drift_tp_frac: 0.4
  reject_if_tp_sl_hit: true
  max_basis_age_hours: 96

correlation_groups:
  - name: jpy_crosses
    members: {"USD/JPY": 1, "GBP/JPY": 1, "EUR/JPY": 1}
  - name: usd_pairs
    members: {"EUR/USD": 1, "GBP/USD": 1, "USD/CAD": -1, "USD/JPY": -1}

setups:
  moon_wolf:
    enabled: true
    label: "🐺 Moon Wolf (15m scan)"
    zone_atr_mult: 1.5        # next 1–3 candles move > 1.5 × ATR(14) away from the base
    tol_atr: 0.2              # zone tolerance for the 15m confirmation (× 1H ATR)
    sl_buffer_atr: 0.3
    min_tp1_pips: 10          # TP1 = max(1R, 10 pips) — pip size per symbol above
    min_rr: 1.5               # to TP2
    near_tp1_frac: 0.8        # skip if price already ran 80% of the way to TP1
    look_15m: 32
    recent_15m: 8
    h1_zone_days: 30
    daily_period: "6mo"

news:
  enabled: true
  window_minutes: 30
  use_feed: false              # live only: also block this week's "High" events from a public JSON feed
  events_utc: []               # e.g. ["2026-10-28T18:00:00Z"] (FOMC)

# Position-size suggestion shown in alerts / signal log (FX only). Illustrative, not advice.
risk_per_trade:
  enabled: false               # off until you set your own account numbers
  account_size: 1000
  currency: "USD"
  risk_pct: 1.0
  lot_step: 0.01
  usdjpy_ref: 150.0            # used for the pip value of JPY crosses

# Persistent CSV of every alert + its TP/SL outcome (viewable in the app).
signal_log:
  enabled: true
  path: "signal_log.csv"

outcomes:
  enabled: true
  max_open_hours: 48
  retain_days: 14

telegram:
  trade_alerts: true
  session_open: true
  daily_summary: true
  scan_updates: false
  data_errors: true
